 if(/direct|nonstop|stops|прям|пересад|düz|aktarma/.test(x))a=f.stops?t(`No, it has ${f.stops} stop via ${f.via}.`,`Нет, пересадка: ${f.via}.`,`Xeyr, aktarma var: ${f.via}.`):t('Yes, it is a direct flight.','Да, рейс прямой.','Bəli, düz reysdir.');
 else if(/baggage|багаж|baqaj/.test(x))a=t(`Baggage allowance: ${f.baggage_kg} kg.`,`Багаж: ${f.baggage_kg} кг.`,`Baqaj: ${f.baggage_kg} kq.`);
 else if(/seat|мест|yer/.test(x))a=t(`${f.seats_available} seats left.`,`Осталось мест: ${f.seats_available}.`,`Qalan yer: ${f.seats_available}.`);
 return(a?a+'\n':'')+fl(f)+` · ${f.cabin} · ${f.baggage_kg} kg · ${t('seats left','мест','yer')}: ${f.seats_available}\n`+t('Say "book it" to reserve (mock).','Скажите «забронируй», чтобы оформить (демо).','Rezerv üçün "rezerv et" yazın (demo).')}
function reserve(kind,label,n){const id='RES-'+(1001+S.res.length);S.res.push({id,kind,label,n});return t(`Reserved (mock, no payment): ${label}. Reference **${id}**.`,`Забронировано (демо, без оплаты): ${label}. Номер **${id}**.`,`Rezerv edildi (demo, ödənişsiz): ${label}. Nömrə **${id}**.`)}
async function flights(x){const L=await FlightRepository.list(),st=S.f,c=cities(x),dt=pDate(x),hasQ=c.any||(dt&&!/seat|мест|yer/.test(x)),ref=pick(x,st.list);
 const bk=/book|reserve|забронир|оформ|rezerv/.test(x);
 if(/compare|сравни|müqayisə/.test(x)&&st.list.length>1)return t('Comparison:','Сравнение:','Müqayisə:')+'\n'+st.list.slice(0,3).map((f,i)=>fl(f,i+1)+` · ${f.baggage_kg} kg`).join('\n');
 if(!hasQ){const f=ref||st.sel||(st.list.length===1?st.list[0]:null);
  if(f){st.sel=f;if(bk){if(!f.seats_available)return t('That flight is sold out.','Мест нет.','Yer yoxdur.');return reserve('flight',`${f.flight_number} ${f.origin.city}→${f.destination.city} ${f.departure_local.replace('T',' ')}`)}return fDetail(f,x)}
  if(st.list.length)return t('Current flight results:','Текущие рейсы:','Cari reyslər:')+'\n'+st.list.map((f,i)=>fl(f,i+1)).join('\n');
  return t('Which route and date? E.g. "Baku to Istanbul on Friday".','Какой маршрут и дата? Например: «Баку — Стамбул в пятницу».','Hansı marşrut və tarix? Məs: "Bakıdan İstanbula cümə".')}
 const o=c.o||'Baku',d=c.d;let r=L.filter(f=>f.origin.city===o&&(!d||f.destination.city===d));
 const all=r;if(dt)r=r.filter(f=>f.departure_local.slice(0,10)===dt);
 if(/direct|nonstop|прям|düz|aktarmasız/.test(x))r=r.filter(f=>!f.stops);
 const mx=priceMax(x);if(mx)r=r.filter(f=>f.price_azn<=mx);
 r.sort(/earliest|раньше|ən tez/.test(x)?(a,b)=>a.departure_local.localeCompare(b.departure_local):(a,b)=>a.price_azn-b.price_azn);
 st.list=r;st.sel=r.length===1?r[0]:null;
 if(!r.length){const ds=[...new Set(all.map(f=>f.departure_local.slice(5,10)))];
  return t(`No flights found for ${o}${d?'→'+d:''}${dt?' on '+dt:''}.`,`Рейсов не найдено: ${o}${d?'→'+d:''}${dt?', '+dt:''}.`,`Reys tapılmadı: ${o}${d?'→'+d:''}${dt?', '+dt:''}.`)+(ds.length?t(` Available dates on this route: ${ds.join(', ')}.`,` Доступные даты на маршруте: ${ds.join(', ')}.`,` Marşrutda mövcud tarixlər: ${ds.join(', ')}.`):'')}
 return t(`${r.length} flight(s), cheapest first:`,`Найдено рейсов: ${r.length} (сначала дешёвые):`,`${r.length} reys tapıldı (ucuzdan bahaya):`)+'\n'+r.map((f,i)=>fl(f,i+1)).join('\n')}
/* ===== Shopping ===== */
const STOP=/^(the|show|find|have|with|that|this|what|please|need|looking|want|give|any|for|you|and|have|is|it|in|stock|show|me|есть|покажи|найди|нужн\w*|мне|или|для|что|как|bir|mənə|göstər|var|axtar|lazım\w*)$/;
const stem=w=>w.slice(0,5),words=x=>(x.match(/[a-zа-яəıöüğşç]{4,}/g)||[]);
let VOC=null;
function vocab(P){if(!VOC){VOC=new Set();P.forEach(p=>ptext(p).forEach(s=>VOC.add(s)))}return VOC}
const ptext=p=>new Set(words(lc([p.name.en,p.name.ru,p.name.az,p.category,p.brand,p.color].join(' '))).map(stem));
const pr=(p,i)=>`${i?i+'. ':''}**${p.name[lang]}** (${p.brand}) · ${money(p.price_azn)} · ★${p.rating} · ${p.stock?t('in stock: '+p.stock,'в наличии: '+p.stock,'stokda: '+p.stock):t('out of stock','нет в наличии','stokda yoxdur')}`;
const cartTxt=P=>{const ids=Object.keys(S.s.cart);if(!ids.length)return t('Your cart is empty.','Корзина пуста.','Səbət boşdur.');let tot=0;return t('Cart:','Корзина:','Səbət:')+'\n'+ids.map(id=>{const p=P.find(z=>z.id===id),q=S.s.cart[id];tot+=p.price_azn*q;return`• ${p.name[lang]} × ${q} = ${money((p.price_azn*q).toFixed(2))}`}).join('\n')+'\n**'+t('Total','Итого','Cəmi')+': '+money(tot.toFixed(2))+'**'};
async function shopping(x){const P=await ProductRepository.list(),st=S.s,V=vocab(P);
 const toks=words(x).filter(w=>!STOP.test(w)&&V.has(stem(w))).map(stem),mx=priceMax(x),mn=priceMin(x);
 let ref=pick(x,st.list);
 const back=/back to|вернём|вернем|вернись|назад к|geri/.test(x),add=/\badd\b|put|в корзину|положи|əlavə|səbətə at/.test(x),rem=/remove|delete|убери|удали|\bsil\b/.test(x);
 if(/compare|сравни|müqayisə/.test(x)&&st.list.length>1)return t('Comparison:','Сравнение:','Müqayisə:')+'\n'+st.list.slice(0,3).map((p,i)=>pr(p,i+1)+' · '+p.description).join('\n');
 if(back&&toks.length){const h=[...st.hist].reverse().find(h=>toks.every(k=>h.toks.includes(k)));if(h){st.list=h.ids.map(id=>P.find(p=>p.id===id));st.sel=h.sel?P.find(p=>p.id===h.sel):null;return t('Back to your earlier list:','Возвращаемся к прежнему списку:','Əvvəlki siyahıya qayıdırıq:')+'\n'+st.list.map((p,i)=>pr(p,i+1)+(st.sel&&st.sel.id===p.id?'  ← '+t('selected','выбрано','seçilib'):'')).join('\n')}}
 if(/\b(cart|basket)\b|корзин|səbət/.test(x)&&!add&&!rem&&!toks.length)return cartTxt(P);
 if((add||rem)&&!toks.length){const p=ref||st.sel||(st.list.length===1?st.list[0]:null);
  if(!p)return t('Which product? Search first or name it.','Какой товар? Найдите его или назовите.','Hansı məhsul? Əvvəlcə axtarın.');
  st.sel=p;if(rem){delete st.cart[p.id];return t('Removed.','Удалено.','Silindi.')+'\n'+cartTxt(P)}
  if(!p.stock)return t(`${p.name.en} is out of stock.`,`${p.name.ru} нет в наличии.`,`${p.name.az} stokda yoxdur.`);
  st.cart[p.id]=(st.cart[p.id]||0)+1;return t('Added to cart.','Добавлено в корзину.','Səbətə əlavə edildi.')+'\n'+cartTxt(P)}
 if(!toks.length&&mx==null&&mn==null){const p=ref||st.sel;
  if(p){st.sel=p;return pr(p)+'\n'+p.description+' · '+p.color}
  if(st.list.length)return st.list.map((p,i)=>pr(p,i+1)).join('\n');
  if(!/product|товар|məhsul|shop|купить|buy|almaq/.test(x))return t('What are you looking for? E.g. "wireless headphones under 100 AZN".','Что ищете? Например: «беспроводные наушники до 100 AZN».','Nə axtarırsınız? Məs: "100 AZN-dən ucuz simsiz qulaqlıq".')}
 let r=P.filter(p=>{const s=ptext(p);return toks.every(k=>s.has(k))&&(mx==null||p.price_azn<=mx)&&(mn==null||p.price_azn>=mn)});
 if(!toks.length&&mx==null&&mn==null)r=[...P].sort((a,b)=>b.rating-a.rating).slice(0,6);
 r.sort((a,b)=>a.price_azn-b.price_azn);st.list=r;st.sel=r.length===1?r[0]:null;
 if(!r.length)return t('No matching products in the catalogue.','Подходящих товаров в каталоге нет.','Kataloqda uyğun məhsul yoxdur.');
 st.hist.push({toks,ids:r.map(p=>p.id),sel:st.sel&&st.sel.id});
 return r.map((p,i)=>pr(p,i+1)).join('\n')}
/* ===== Cinema ===== */
const GEN=[['sci-fi',/sci-?fi|science fiction|фантаст|elmi/],['comedy',/comed|комед|komediya/],['horror',/horror|ужас|qorxu/],['action',/action|боевик|aksiyon|döyüş/],['drama',/drama|драм/],['animation',/animat|мульт|animasiya/],['romance',/romance|романт|romantik/],['thriller',/thriller|триллер/],['adventure',/adventure|приключ|macəra/],['family',/family|семейн|ailə/],['mystery',/mystery|детектив|sirr/],['crime',/crime|криминал/]];
const LG=[['English',/english|англий|ingilis/],['Russian',/russian|русск|\brus\b/],['Azerbaijani',/azerbaijani|азербайдж|azərbaycan/]];
async function cinema(x){const M=await ShowtimeRepository.movies(),ST=await ShowtimeRepository.list(),CN=await ShowtimeRepository.cinemas(),st=S.c;
 const dt=pDate(x),g=GEN.filter(([,re])=>re.test(x)).map(a=>a[0]),lg=LG.filter(([,re])=>re.test(x)).map(a=>a[0]),nm=M.filter(m=>x.includes(lc(m.title)));
 const bk=/book|reserve|забронир|купить|купи|rezerv|\bal\b/.test(x),q=qty(x),ref=pick(x,st.list),filt=g.length||lg.length||nm.length||dt;
 const mv=id=>M.find(m=>m.id===id),cn=id=>CN.find(c=>c.id===id).name.replace('CinemaPlus ','');
 const line=(s,i)=>{const m=mv(s.movie_id);return`${i?i+'. ':''}**${m.title}** (${m.genre.join('/')}, ${m.age_rating}, ★${m.rating}, ${m.language}) · ${cn(s.cinema_id)} · ${s.date.slice(8)}.${s.date.slice(5,7)} ${s.time} · ${money(s.price_azn)} · ${s.seats_available?s.seats_available+' '+t('seats','мест','yer'):t('sold out','распродано','bilet yoxdur')}`};
 const doBook=s=>{if(!s.seats_available||s.seats_available<q)return t(`Only ${s.seats_available} seat(s) left for that showtime.`,`На этот сеанс осталось мест: ${s.seats_available}.`,`Bu seansda yalnız ${s.seats_available} yer qalıb.`);
  s.seats_available-=q;return reserve('cinema',`${mv(s.movie_id).title}, ${cn(s.cinema_id)}, ${s.date} ${s.time}, ${q} ${t('seat(s)','мест','yer')}, ${money(q*s.price_azn)}`)};
 if(!filt){const s=ref||st.sel||(st.list.length===1?st.list[0]:null);
  if(bk){if(!s)return t('Which film and showtime should I book? Search first, e.g. "what is playing tonight?".','На какой фильм и сеанс бронировать? Сначала найдите сеанс, например «что идёт сегодня вечером?».','Hansı film və seans üçün rezerv edim? Məs: "bu axşam nə var?".');st.sel=s;return doBook(s)}
  if(s){st.sel=s;return line(s)}}
 let ms=M.filter(m=>(!g.length||g.some(k=>m.genre.includes(k)))&&(!lg.length||lg.includes(m.language))&&(!nm.length||nm.includes(m)));
 let r=ST.filter(s=>ms.some(m=>m.id===s.movie_id)&&(!dt||s.date===dt)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 st.list=r;st.sel=r.length===1?r[0]:null;
 if(!r.length)return t('No matching showtimes.','Подходящих сеансов нет.','Uyğun seans tapılmadı.');
 if(bk&&r.length===1)return doBook(r[0]);
 return r.map((s,i)=>line(s,i+1)).join('\n')+(r.length>1?'\n'+t('Pick one ("the 2nd") to book.','Выберите сеанс («второй»), чтобы забронировать.','Rezerv üçün seans seçin ("ikinci").'):'')}
/* ===== Router ===== */
const RF=/flight|fly\b|airline|baggage|nonstop|non-stop|direct|layover|\bstops?\b|aviasales|рейс|перел[её]т|авиа|самол[её]т|пересад|багаж|прям(ой|ые)|uçuş|reys|təyyarə|aktarma|\bdüz\b|baqaj/;
const RC=/film|movie|cinema|showtime|playing|screening|\bseats?\b|ticket|tonight|sci-?fi|horror|comedy|фильм|кино|сеанс|\bмест|билет|ужасы|комед|фантаст|мульт|kino|seans|\byer\b|bilet|komediya|qorxu|animasiya|cinemaplus/;
let RS=null;
async function shopRe(){if(!RS){const P=await ProductRepository.list();RS=new RegExp('('+[...vocab(P)].filter(s=>!/^(home|black|white|blue|grey|silve|multi|lite|water)$/.test(s)).join('|')+')|\\b(cart|buy|basket|stock|price)\\b|корзин|купить|товар|в наличии|səbət|məhsul|stokda|almaq')}return RS}
const AMB=/book it|reserve it|something|anything|recommend|\bgood\b|\bbest\b|посоветуй|что-нибудь|что-то|хорош|забронируй (это|его)|yaxşı|məsləhət|nəsə|rezerv et/;
const ANC=/\bone\b|\bit\b|\bthat\b|\bthis\b|first|second|third|cheap|and for|what about|\band\b|перв|втор|трет|дешев|этот|тот|а на|и на|bəs|birinci|ikinci|ucuz|\d(st|nd|rd)\b|сколько|how many/;
async function route(x,last){const re=await shopRe(),d=[];if(RF.test(x))d.push('flights');if(await RS.test(x))d.push('shopping');if(RC.test(x))d.push('cinema');
 if(d.length>1)return{cat:'mixed',d};if(d.length===1)return{cat:d[0],d};
 if(last&&ANC.test(x)&&!/something|anything/.test(x))return{cat:'follow-up',d:[last]};
 if(AMB.test(x))return{cat:'ambiguous',d:[]};return{cat:'out-of-scope',d:[]}}
const H={flights,shopping,cinema};
function detect(x){if(/[а-яё]/.test(x))return'ru';if(/[əğışçöü]|\b(və|bir|üçün|nə|göstər|mənə|axtar|uçuş|noutbuk|qulaq|bu gün|sabah|şənbə|cümə|istəyirəm|lazımdır|var\?|bakıdan|salam)\b/.test(x))return'az';return/[a-z]{3}/.test(x)?'en':null}
async function answer(raw){const x=lc(raw.trim()),l=detect(x);if(l)lang=S.sess.lang=l;
 const r=await route(x,S.sess.last);let out='';
 try{
  if(r.cat==='ambiguous')out=t('Could you clarify: are you after flights, products or films?','Уточните, пожалуйста: вас интересуют авиабилеты, товары или фильмы?','Dəqiqləşdirin: uçuş, məhsul yoxsa film?');
  else if(r.cat==='out-of-scope')out=t('Sorry, I can only help with flights, shopping and cinema. Try "flights to Istanbul", "wireless headphones" or "what is playing tonight?".','Извините, я помогаю только с авиабилетами, покупками и кино. Попробуйте: «рейсы в Стамбул», «наушники» или «что идёт сегодня вечером?».','Bağışlayın, yalnız uçuş, alış-veriş və kino ilə bağlı kömək edə bilərəm. Məs: "İstanbula reys", "simsiz qulaqlıq" və ya "bu axşam nə var?".');
  else if(r.cat==='mixed'){const nm={flights:t('Flights','Рейсы','Reyslər'),shopping:t('Shopping','Покупки','Alış-veriş'),cinema:t('Cinema','Кино','Kino')};
   const parts=[];for(const k of r.d)parts.push('**'+nm[k]+'**\n'+await H[k](x));out=parts.join('\n\n');S.sess.last=r.d[r.d.length-1]}
  else{const k=r.d[0];out=await H[k](x);S.sess.last=k}
 }catch(e){console.error(e);out=t('Sorry, the data source is unavailable right now. Please try again.','Извините, источник данных сейчас недоступен. Попробуйте ещё раз.','Bağışlayın, məlumat mənbəyi hazırda əlçatmazdır.')}
 return{out,cat:r.cat+(r.d.length&&r.cat!=='mixed'&&r.cat!==r.d[0]?' → '+r.d[0]:'')}}

const log=document.getElementById('log'),inp=document.getElementById('q');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;'),fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function add(cls,html,tag){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=(tag?'<span class="tag">'+tag+'</span><br>':'')+html;log.appendChild(d);log.scrollTop=log.scrollHeight}

['Find me a flight from Baku to Istanbul on Friday','What is playing tonight?','Do you have wireless headphones under 100 AZN?','Показать ноутбуки','Bakıdan İstanbula 6 noyabr reys','I need a flight to Istanbul on 6 November and a backpack for the trip','Show me something good','Book two seats'].forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=()=>send(s);ch.appendChild(b)});

const TESTS=[['find me a flight from baku to istanbul on friday','flights'],['what is playing tonight?','cinema'],['do you have wireless headphones under 100 azn?','shopping'],['show me laptops','shopping'],['i need a flight to istanbul on 6 november and a backpack for the trip','mixed'],['show me something good','ambiguous'],['what is the weather in ganja?','out-of-scope'],['book two seats','cinema'],['покажи рейсы в стамбул','flights'],['какие фильмы сегодня','cinema'],['нужен рюкзак','shopping'],['bakıdan dubaya uçuş','flights'],['bu axşam hansı filmlər var?','cinema'],['simsiz qulaqlıq','shopping'],['the cheaper one, is it direct?','flights','flights'],['the second one, is it in stock?','shopping'],['and for saturday?','follow-up','cinema'],['tell me a joke','out-of-scope']];
